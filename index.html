<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Monitoring Tambak Lele</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>Monitoring Suhu Tambak Lele</h1>

        <p>
            Dashboard Monitoring Berbasis ESP32 & Firebase
        </p>

    </header>

    <main>

        <section class="status">

            <div class="status-card">

                <h2>Status ESP32</h2>

                <p id="espStatus">
                    Menghubungkan...
                </p>

            </div>

            <div class="status-card">

                <h2>Update Terakhir</h2>

                <p id="updateTime">
                    --
                </p>

            </div>

        </section>

        <section class="cards">

            <div class="card">

                <h2>Sensor 1</h2>

                <p id="suhu1">-- °C</p>

            </div>

            <div class="card">

                <h2>Sensor 2</h2>

                <p id="suhu2">-- °C</p>

            </div>

            <div class="card">

                <h2>Sensor 3</h2>

                <p id="suhu3">-- °C</p>

            </div>

        </section>

        <section class="chart">

            <h2>Grafik Riwayat</h2>

            <canvas id="historyChart"></canvas>

        </section>

        <section class="history">

            <h2>Riwayat Monitoring</h2>

            <div id="historyTable">

                Belum ada data

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module" src="firebase.js"></script>

    <script type="module" src="script.js"></script>

</body>

</html>
