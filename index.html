<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monitoring Tambak Lele</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>Monitoring Suhu Tambak Lele</h1>

        <p>Dashboard Monitoring Berbasis ESP32 dan Firebase</p>

    </header>

    <main>

        <section class="status">

            <div class="status-box">

                <h3>Status ESP32</h3>

                <p id="status">
                    🟡 Menghubungkan...
                </p>

            </div>

            <div class="status-box">

                <h3>Update Terakhir</h3>

                <p id="update">
                    --
                </p>

            </div>

        </section>

        <section class="sensor">

            <div class="card">

                <h2>Sensor 1</h2>

                <p id="suhu1">-- °C</p>

            </div>

            <div class="card">

                <h2>Sensor 2</h2>

                <p id="suhu2">-- °C</p>

            </div>

            <div class="card">

                <h2>Sensor 3</h2>

                <p id="suhu3">-- °C</p>

            </div>

        </section>

    </main>

</body>

</html>
